# /etc/nginx/sites-available/coolcaredetails.conf
# Symlink into sites-enabled/ then `sudo nginx -t && sudo systemctl reload nginx`.
# After DNS is pointing here, run:
#   sudo certbot --nginx -d coolcaredetails.com -d www.coolcaredetails.com
# certbot rewrites this file to add the TLS block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name coolcaredetails.com www.coolcaredetails.com;

    # Uploads (booking form, invoice items, etc.) — plenty for JSON payloads.
    client_max_body_size 2m;

    # Real client IP through the proxy so brute-force throttling in the app
    # sees the visitor's address, not 127.0.0.1.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Node app runs on localhost — nothing binds to :3000 publicly.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_read_timeout 30s;
    }

    # Health check reachable without TLS for uptime monitors on the box.
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }
}
